services:
  taskboard:
    build: .
    container_name: taskboard
    restart: unless-stopped
    ports:
      - "8081:8080"          # host 8081 (8080 taken by roadmap) -> container 8080
    volumes:
      - ./data:/data         # tasks.db lives here, survives rebuilds
    environment:
      - TZ=Europe/Zagreb
      - REFRESH_SECONDS=30   # tablet auto-refresh interval
